<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0f17">
  <title>LiveDraw — Mobile-First Real-Time Drawing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Sleek Minimal Top Header Bar -->
    <header id="top-bar">
      <div class="header-left">
        <!-- Color Trigger -->
        <button id="btn-color-trigger" class="header-btn" title="Choose Color" aria-label="Color Picker">
          <span id="active-color-indicator"></span>
          <span class="header-btn-label">Color</span>
        </button>

        <!-- Size Trigger -->
        <button id="btn-size-trigger" class="header-btn" title="Brush Size" aria-label="Brush Size">
          <div class="size-icon-dot"></div>
          <span class="header-btn-label" id="active-size-label">2px</span>
        </button>

        <!-- Image Import Trigger -->
        <button id="btn-import-image" class="header-btn" title="Add Reference Image (Local only, 50% opacity)" aria-label="Add Reference Image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span class="header-btn-label">Image</span>
        </button>
        <input type="file" id="image-upload-input" accept="image/*" class="hidden">

        <!-- Clear Board -->
        <button id="btn-clear" class="header-btn danger-btn" title="Clear Canvas" aria-label="Clear Canvas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          <span class="header-btn-label">Clear</span>
        </button>
      </div>

      <div class="header-right">
        <!-- Live Chat Trigger Button with Unread Badge -->
        <button id="btn-chat-trigger" class="header-btn chat-trigger-btn" title="Open Live Chat" aria-label="Live Chat">
          <div class="chat-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chat-unread-badge" class="chat-unread-badge hidden">0</span>
          </div>
          <span class="header-btn-label">Chat</span>
        </button>

        <!-- Minimal Combined Stats (Users & Ping) -->
        <div class="header-stat-pill" title="Connected Users & Latency">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
          </svg>
          <span id="user-count-display">1</span>
          <span class="stat-divider">·</span>
          <span id="latency-display">&lt;10ms</span>
        </div>

        <!-- Minimal User Tag -->
        <button id="my-user-tag" class="user-tag" title="Click to change your display name" aria-label="Change Name">
          <span class="user-color-dot" id="my-user-dot"></span>
          <span id="my-user-id">YOU</span>
        </button>
      </div>
    </header>

    <!-- Canvas Viewport -->
    <main id="canvas-container">
      <canvas id="base-canvas" class="drawing-layer"></canvas>
      <canvas id="active-canvas" class="drawing-layer"></canvas>
      <canvas id="cursor-canvas" class="drawing-layer"></canvas>

      <!-- Selection Context Actions (Simple Delete Button) -->
      <div id="selection-actions" class="selection-actions hidden">
        <button id="btn-delete-selection" class="selection-delete-btn" title="Delete selection (Del / Backspace)" aria-label="Delete selection">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>

      <!-- Floating Local Reference Image Control Bar -->
      <div id="reference-image-bar" class="reference-image-bar hidden">
        <div class="ref-badge" title="Local reference image visible only on your device">
          <span class="ref-badge-dot"></span>
          <span class="ref-badge-text">Reference</span>
        </div>
        <button id="btn-ref-lock" class="ref-btn" title="Lock position to draw/trace over it" aria-label="Lock Reference Image">
          <svg class="icon-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
          <svg class="icon-locked hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="ref-lock-label">Lock</span>
        </button>
        <button id="btn-ref-opacity" class="ref-btn" title="Cycle Opacity (50% -> 25% -> 75%)" aria-label="Adjust Opacity">
          <span id="ref-opacity-label">50%</span>
        </button>
        <button id="btn-ref-delete" class="ref-btn danger-btn" title="Remove reference image" aria-label="Remove Reference Image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </main>

    <!-- Floating Color Picker Tray -->
    <div id="color-tray" class="floating-tray hidden">
      <div class="color-palette">
        <button class="color-swatch active" data-color="#1e1e1e" style="--c: #1e1e1e;" aria-label="Black"></button>
        <button class="color-swatch" data-color="#ef4444" style="--c: #ef4444;" aria-label="Red"></button>
        <button class="color-swatch" data-color="#f97316" style="--c: #f97316;" aria-label="Orange"></button>
        <button class="color-swatch" data-color="#eab308" style="--c: #eab308;" aria-label="Yellow"></button>
        <button class="color-swatch" data-color="#10b981" style="--c: #10b981;" aria-label="Green"></button>
        <button class="color-swatch" data-color="#06b6d4" style="--c: #06b6d4;" aria-label="Cyan"></button>
        <button class="color-swatch" data-color="#3b82f6" style="--c: #3b82f6;" aria-label="Blue"></button>
        <button class="color-swatch" data-color="#8b5cf6" style="--c: #8b5cf6;" aria-label="Purple"></button>
        <button class="color-swatch" data-color="#ec4899" style="--c: #ec4899;" aria-label="Pink"></button>
        <button class="color-swatch" data-color="#ffffff" style="--c: #ffffff;" aria-label="White"></button>
        <label class="custom-color-btn" title="Custom Color">
          <input type="color" id="custom-color-input" value="#1e1e1e">
          <span class="custom-color-icon">🎨</span>
        </label>
      </div>
    </div>

    <!-- Floating Size Slider Tray -->
    <div id="size-tray" class="floating-tray hidden">
      <div class="size-controls">
        <div class="size-preview-wrapper">
          <div id="size-preview-dot"></div>
        </div>
        <input type="range" id="size-slider" min="1" max="40" value="2" step="1">
        <span id="size-value-display">2px</span>
      </div>
    </div>

    <!-- Bottom Floating Toolbar (Compact Single Row) -->
    <nav id="bottom-bar">
      <div class="toolbar-pill">
        <!-- Pen Tool -->
        <button id="tool-pen" class="tool-btn active" title="Pen (P)" aria-label="Pen Tool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
          <span class="tool-label">Pen</span>
        </button>

        <!-- Eraser Tool -->
        <button id="tool-eraser" class="tool-btn" title="Eraser (E)" aria-label="Eraser Tool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
            <path d="M22 21H7"></path>
            <path d="m5 11 9 9"></path>
          </svg>
          <span class="tool-label">Eraser</span>
        </button>

        <!-- Select & Move Tool -->
        <button id="tool-select" class="tool-btn" title="Select & Move (S)" aria-label="Select Tool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 3 7 18 3-7 7-3L3 3z"></path>
            <path d="m13 13 6 6"></path>
          </svg>
          <span class="tool-label">Select</span>
        </button>

        <!-- Zoom & Pan Tool -->
        <button id="tool-zoom" class="tool-btn" title="Pan & Zoom with fingers (Z / H)" aria-label="Pan and Zoom Tool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <span class="tool-label">Zoom</span>
        </button>

        <!-- Instant 100% Zoom Reset Button -->
        <button id="btn-reset-zoom" class="tool-btn action-btn reset-zoom-btn" title="Instantly Reset Zoom to 100% (0)" aria-label="Reset Zoom">
          <span class="reset-badge-text">1:1</span>
          <span class="tool-label">100%</span>
        </button>

        <div class="tool-divider"></div>

        <!-- Undo -->
        <button id="btn-undo" class="tool-btn action-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"></path>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
          </svg>
          <span class="tool-label">Undo</span>
        </button>

        <!-- Redo -->
        <button id="btn-redo" class="tool-btn action-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 7v6h-6"></path>
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
          </svg>
          <span class="tool-label">Redo</span>
        </button>
      </div>
    </nav>

    <!-- First-Time / Name Change Modal -->
    <div id="name-modal" class="modal-backdrop hidden">
      <div class="name-card">
        <div class="name-card-header">
          <div class="name-card-icon">🎨</div>
          <h3 id="name-modal-title">Welcome to LiveDraw</h3>
          <p id="name-modal-subtitle">Choose your display name for the live board:</p>
        </div>
        <form id="name-form" onsubmit="return false;">
          <div class="input-group">
            <input type="text" id="username-input" maxlength="20" placeholder="e.g. Alex, Creative_Fox" autocomplete="off" autocorrect="off" autocapitalize="none">
          </div>
          <div class="modal-actions">
            <button type="button" id="btn-random-name" class="secondary-btn" title="Generate random name">🎲 Random</button>
            <button type="submit" id="btn-save-name" class="primary-btn">Join Board</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Floating Glassmorphic Chat Panel -->
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">
        <div class="chat-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Live Chat</span>
        </div>
        <button id="btn-close-chat" class="chat-close-btn" aria-label="Close Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="chat-messages" class="chat-messages">
        <div class="chat-sys-msg">Welcome to LiveDraw Chat!</div>
      </div>

      <form id="chat-form" class="chat-form" onsubmit="return false;">
        <input type="text" id="chat-input" placeholder="Type a message..." maxlength="300" autocomplete="off">
        <button type="submit" id="btn-send-chat" class="chat-send-btn" aria-label="Send Message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast-container"></div>
  </div>

  <script src="/static/protocol.js"></script>
  <script src="/static/webrtc.js"></script>
  <script src="/static/canvas.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
